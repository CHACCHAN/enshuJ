spring.application.name=demo
# リバースプロキシ (Cloudflare 等) が付与する X-Forwarded-Proto を信頼し
# Spring Boot のリダイレクト URL を https:// で生成する
server.forward-headers-strategy=native
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.datasource.url=jdbc:h2:file:./data/demo_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=uploads/shop-images
app.avatar-dir=uploads/avatars
